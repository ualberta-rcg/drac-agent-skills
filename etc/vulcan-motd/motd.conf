# /etc/vulcan-motd/motd.conf — site config for vulcan-status.
# Plain sourced shell. All values shown are the defaults.

# Name shown in the header line (default: short hostname)
#CLUSTER_NAME=vulcan1

# Free-form notices file; rendered verbatim under "» Notice" when non-empty
#ANNOUNCE=/etc/vulcan-motd/announce.txt

# Max job rows in "» Your jobs" (an overflow line always shows the rest)
#MAX_JOBS=3

# Max project dirs in "» Storage" (found via ~/projects/* symlinks)
#MAX_PROJECTS=3

# Terminal width (cols) at or above which the wide layout is used
#WIDE_MIN=70

# Per-user storage probe paths (Isilon reports per-user quota via df)
#HOME_BASE=/home
#SCRATCH_BASE=/scratch

# Fairshare tier thresholds. The factor is 0..1, higher = more priority
# headroom: boosted >= FS_BOOST · ahead >= FS_AHEAD · nominal >= FS_NOMINAL
# behind >= FS_BEHIND · throttled below
#FS_BOOST=0.80
#FS_AHEAD=0.60
#FS_NOMINAL=0.40
#FS_BEHIND=0.20

# LevelFS verdict bands: below LFS_LOW = bad, above LFS_HIGH (incl. inf) = good
#LFS_LOW=0.75
#LFS_HIGH=1.25

# Storage bar color bands (% used): teal below DISK_MID, blue below
# DISK_HIGH, bold red at/above
#DISK_MID=33
#DISK_HIGH=66

# Per-query timeout (seconds) on the login path; the whole render is also
# wrapped in `timeout 6` by /etc/profile.d/zz-vulcan-motd.sh
#Q_TIMEOUT=3

# ---- caching ---------------------------------------------------------------
# Cluster block reads the root-baked flat file (vulcan-motd-bake, every
# 10 min via systemd timer) instead of querying Slurm at login.
#CACHE_DIR=/run/vulcan-motd
#CLUSTER_CACHE=$CACHE_DIR/cluster
#HEARTBEAT=$CACHE_DIR/heartbeat
#CLUSTER_TTL=900          # max cache age (s) before cluster falls back to live
# Per-user cache for slow-changing blocks (fairshare, storage); lives under
# the user's own runtime dir (tmpfs, no privilege needed).
#USER_CACHE_DIR=${XDG_RUNTIME_DIR:-/tmp}/vulcan-motd
#FAIRSHARE_TTL=900
#STORAGE_TTL=900
